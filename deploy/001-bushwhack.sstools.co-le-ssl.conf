<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bushwhack.sstools.co

    ProxyPreserveHost On
    # Uploads are capped at 2 MB by the app; leave headroom for the form.
    LimitRequestBody 3145728
    ProxyTimeout 30

    ProxyPass        / http://127.0.0.1:${PORT_BUSHWHACK}/
    ProxyPassReverse / http://127.0.0.1:${PORT_BUSHWHACK}/

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/sstools.co-wildcard/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sstools.co-wildcard/privkey.pem

    ErrorLog  "logs/sites/bushwhack.sstools.co/error_log"
    CustomLog "logs/sites/bushwhack.sstools.co/access_log" vhostlog
</VirtualHost>
</IfModule>
