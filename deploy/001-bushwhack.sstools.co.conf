<VirtualHost *:80>
    ServerName bushwhack.sstools.co
    DocumentRoot "/var/www/vhosts/bushwhack.sstools.co"

    <Directory "/var/www/vhosts/bushwhack.sstools.co">
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =bushwhack.sstools.co
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  "logs/redirects/http/error_log"
    CustomLog "logs/redirects/http/access_log" vhostlog
</VirtualHost>
